<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>👑 Su Komutanı</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

    <div class="header">
        <h1>👑 Su Komutanı</h1>
        <p>Padişah Sürümü</p>
    </div>

    <div class="card">

        <h2>📅 Bugün</h2>

        <div id="todayDate"></div>

    </div>

    <div class="card">

        <h2>💧 Günlük Su</h2>

        <div class="big-number" id="waterValue">
            0 / 4000 ml
        </div>

        <div class="progress">
            <div class="bar" id="waterBar"></div>
        </div>

        <div class="button-grid">
            <button onclick="addWater(250)">250ml</button>
            <button onclick="addWater(500)">500ml</button>
            <button onclick="addWater(750)">750ml</button>
            <button onclick="addWater(1000)">1L</button>
            <button onclick="addWater(1500)">1.5L</button>
        </div>

    </div>

    <div class="card">

        <h2>🍗 Protein</h2>

        <input
        type="number"
        id="proteinInput"
        placeholder="Protein gramı">

        <button onclick="addProtein()">
            Protein Ekle
        </button>

        <div class="big-number">
            <span id="proteinValue">0</span> / 130 g
        </div>

    </div>

    <div class="card">

        <h2>🔥 Kalori</h2>

        <input
        type="number"
        id="calorieInput"
        placeholder="Kalori">

        <button onclick="addCalories()">
            Kalori Ekle
        </button>

        <div class="big-number">
            <span id="calorieValue">0</span> kcal
        </div>

    </div>

    <div class="card">

        <h2>⚖️ Kilo Takibi</h2>

        <input
        type="number"
        id="weightInput"
        placeholder="Kilon">

        <button onclick="saveWeight()">
            Kaydet
        </button>

        <div id="weightText"></div>

    </div>

    <div class="card">

        <h2>📏 Bel Ölçüsü</h2>

        <input
        type="number"
        id="waistInput"
        placeholder="Bel çevresi">

        <button onclick="saveWaist()">
            Kaydet
        </button>

        <div id="waistText"></div>

    </div>

    <div class="card">

        <h2>🏋️ Antrenman</h2>

        <button onclick="workoutDone()">
            Antrenman Yapıldı
        </button>

        <div id="workoutStatus">
            Bekleniyor
        </div>

    </div>

    <div class="card">

        <h2>📊 Günlük Geçmiş</h2>

        <div id="historyBox"></div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
